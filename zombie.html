<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b3a4a">
<title>Squad Rush</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#b9cbd6;
    font-family:"Baloo 2","Fredoka","Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #c{display:block;width:100vw;height:100vh;touch-action:none}
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none!important}
  .shadowText{color:#fff;font-weight:900;text-shadow:0 2px 0 #1b2633,0 3px 8px rgba(0,0,0,.35)}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
  #top{position:relative;height:44px;display:flex;align-items:center;gap:10px}
  #title{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34%}
  #progress{flex:1;height:14px;border-radius:8px;background:rgba(20,30,45,.55);border:2px solid #1b2633;position:relative}
  #progFill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px;background:linear-gradient(#7ad0ff,#2f8cff)}
  #progBoss{position:absolute;right:-12px;top:50%;transform:translateY(-50%);font-size:20px}
  #score{flex:1;text-align:center;font-size:22px;font-variant-numeric:tabular-nums}
  #pauseBtn{width:40px;height:40px;flex:none;border-radius:50%;border:3px solid #1b2633;
    background:linear-gradient(#566b82,#3a4b5e);color:#fff;font-size:15px;font-weight:900;
    box-shadow:0 3px 0 #10171f;pointer-events:auto}
  #pauseBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #10171f}
  #bossBar{margin:10px auto 0;max-width:420px;text-align:center}
  #bossName{font-size:15px;letter-spacing:1px}
  #bossHp{height:16px;margin-top:3px;border-radius:9px;background:rgba(20,10,25,.6);border:2px solid #2a1033;overflow:hidden}
  #bossFill{height:100%;width:100%;background:linear-gradient(#d06bff,#8a2bd0);transition:width .12s}
  #count{position:fixed;left:0;top:0;transform:translate(-50%,-100%);min-width:44px;padding:2px 12px;
    border-radius:16px;background:#2f6fd6;border:3px solid #fff;color:#fff;font-weight:900;font-size:22px;
    text-align:center;box-shadow:0 3px 0 #1a3f80,0 4px 10px rgba(0,0,0,.3);font-variant-numeric:tabular-nums}
  #count.bump{animation:bump .25s}
  #count.hurt{background:#d63a3a;box-shadow:0 3px 0 #7d1a1a}
  @keyframes bump{50%{transform:translate(-50%,-100%) scale(1.25)}}
  #toast{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%);font-size:34px;white-space:nowrap;
    opacity:0;transition:opacity .25s}
  #toast.show{opacity:1;animation:pop .35s}
  #toast.danger{color:#ffdddd;text-shadow:0 3px 0 #7a0f14,0 4px 12px rgba(0,0,0,.4)}
  @keyframes pop{from{transform:translate(-50%,-50%) scale(.6)}to{transform:translate(-50%,-50%) scale(1)}}
  #hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);transform:translateX(-50%);
    font-size:19px;opacity:.95;animation:hintPulse 1.1s infinite alternate;white-space:nowrap}
  @keyframes hintPulse{to{opacity:.45}}
  .floater{position:fixed;transform:translate(-50%,-50%);font-weight:900;font-size:30px;pointer-events:none;z-index:6;
    animation:floatUp .9s ease-out forwards}
  .floater.good{color:#bfe6ff;text-shadow:0 3px 0 #0d3b8c}
  .floater.bad{color:#ffd0d0;text-shadow:0 3px 0 #7a0f14}
  @keyframes floatUp{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-70px}}

  /* ---------- screens ---------- */
  .screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:24px 16px;background:linear-gradient(rgba(20,28,40,.25),rgba(20,28,40,.7))}
  .logo{font-size:clamp(46px,13vw,76px);line-height:.9;text-align:center;color:#fff;font-weight:900;letter-spacing:1px;
    text-shadow:0 4px 0 #1b2633,0 7px 0 #2f6fd6,0 10px 18px rgba(0,0,0,.45);transform:rotate(-3deg);margin-bottom:6px}
  .logo span{color:#ffd23e}
  .tag{color:#fff;font-weight:800;font-size:16px;opacity:.9;text-align:center;text-shadow:0 2px 0 #1b2633}
  .big{width:min(300px,84vw);padding:13px 0;border-radius:18px;border:3px solid #1b2633;color:#fff;font-size:24px;font-weight:900;
    text-shadow:0 2px 0 rgba(0,0,0,.3);box-shadow:0 5px 0 #10171f,0 8px 16px rgba(0,0,0,.3)}
  .big:active{transform:translateY(3px);box-shadow:0 2px 0 #10171f}
  .blue{background:linear-gradient(#5aa8ff,#2f6fd6)}
  .green{background:linear-gradient(#6fdc6a,#2fa53a)}
  .gray{background:linear-gradient(#7c8a99,#4d5b6a)}
  .small{font-size:18px;padding:9px 0}
  .stat{color:#fff;font-weight:800;font-size:16px;text-shadow:0 2px 0 #1b2633}
  #soundBtn{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);width:44px;height:44px;border-radius:50%;
    border:3px solid #1b2633;background:linear-gradient(#566b82,#3a4b5e);color:#fff;font-size:20px;z-index:11;box-shadow:0 3px 0 #10171f}
  #grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:min(360px,92vw)}
  .lv{aspect-ratio:1;border-radius:14px;border:3px solid #1b2633;font-size:24px;font-weight:900;color:#fff;
    background:linear-gradient(#5aa8ff,#2f6fd6);box-shadow:0 4px 0 #10171f;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
  .lv small{font-size:11px;opacity:.9;margin-top:-4px}
  .lv.done{background:linear-gradient(#6fdc6a,#2fa53a)}
  .lv:disabled{background:linear-gradient(#7c8a99,#4d5b6a);opacity:.75;cursor:default}
  .card{background:rgba(20,28,40,.82);border:3px solid #1b2633;border-radius:22px;padding:22px 18px;width:min(340px,92vw);
    display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .card h2{margin:0;color:#fff;font-size:32px;font-weight:900;text-align:center;text-shadow:0 3px 0 #000}
  .card h2.win{color:#ffd23e}
  .card h2.lose{color:#ff8a8a}
  .card .big{width:100%}
  .overlay{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;background:rgba(10,15,22,.45)}
  .rows{width:100%;display:flex;flex-direction:column;gap:4px}
  .row{display:flex;justify-content:space-between;color:#dfe8f2;font-weight:800;font-size:17px}
  .row b{color:#fff}
  .newbest{color:#ffd23e;font-weight:900;font-size:18px;animation:hintPulse .6s infinite alternate}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="top">
    <div id="title" class="shadowText"></div>
    <div id="progress"><div id="progFill"></div><div id="progBoss">💀</div></div>
    <div id="score" class="shadowText hidden"></div>
    <button id="pauseBtn" aria-label="Pause">❚❚</button>
  </div>
  <div id="bossBar" class="hidden">
    <div id="bossName" class="shadowText">BOSS</div>
    <div id="bossHp"><div id="bossFill"></div></div>
  </div>
  <div id="count">1</div>
  <div id="toast" class="shadowText"></div>
  <div id="hint" class="shadowText">Drag or ← → to steer</div>
</div>

<button id="soundBtn" aria-label="Sound">🔊</button>

<div id="menu" class="screen">
  <div class="logo">SQUAD<br><span>RUSH</span></div>
  <div class="tag">Grow your squad. Shoot the horde. Beat the boss.</div>
  <button class="big blue" id="playLevels">Levels</button>
  <button class="big green" id="playFree">Free Mode</button>
  <div class="stat" id="menuBest"></div>
</div>

<div id="levelsScreen" class="screen hidden">
  <div class="logo" style="font-size:40px">LEVELS</div>
  <div id="grid"></div>
  <button class="big gray small" id="levelsBack">Back</button>
</div>

<div id="pause" class="overlay hidden">
  <div class="card">
    <h2>Paused</h2>
    <button class="big blue" id="resumeBtn">Resume</button>
    <button class="big gray small" id="restartBtn">Restart</button>
    <button class="big gray small" id="pauseSound">Sound: on</button>
    <button class="big gray small" id="quitBtn">Menu</button>
  </div>
</div>

<div id="result" class="overlay hidden">
  <div class="card">
    <h2 id="resTitle"></h2>
    <div class="rows" id="resRows"></div>
    <div class="newbest hidden" id="resBest">New best!</div>
    <button class="big green" id="resMain"></button>
    <button class="big gray small" id="resRetry">Retry</button>
    <button class="big gray small" id="resMenu">Menu</button>
  </div>
</div>

<script type="module" src="./src/squad/main.js"></script>
</body>
</html>
